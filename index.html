<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Samuelov denný AI Digest: novinky z AI po ľudsky, benchmarky modelov a financie." />
  <title>AI Digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231d1b18%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-size=%2228%22 font-family=%22Georgia%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23f6f1e7%22%3EAI%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <a class="skip-link" href="#obsah">Preskočiť na obsah</a>

  <header class="masthead" role="banner">
    <div class="masthead__inner">
      <a class="brand" href="./" aria-label="AI Digest – najnovšie vydanie">
        <span class="brand__badge" aria-hidden="true">AI</span>
        <span class="brand__text">
          <span class="brand__name">AI Digest</span>
          <span class="brand__date" id="day-title">Denný prehľad</span>
        </span>
      </a>
      <div class="day-picker">
        <label for="day-select" class="day-picker__label">Vydanie</label>
        <select id="day-select" class="day-picker__select" aria-label="Vyber deň"></select>
      </div>
    </div>
    <nav class="jump" aria-label="Sekcie" id="jump-nav"></nav>
  </header>

  <main id="obsah" class="wrap">
    <div id="app-root" aria-live="polite"><p class="loading">Načítavam dnešné vydanie…</p></div>
  </main>

  <div id="term-pop" class="term-pop" role="tooltip" hidden></div>
  <script src="app.js?v=2"></script>
</body>
</html>
